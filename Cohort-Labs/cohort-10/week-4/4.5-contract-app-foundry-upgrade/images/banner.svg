<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0L0 0 0 32" fill="none" stroke="#0078D4" stroke-width="0.4" opacity="0.12"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C8E8"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0078D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0078D4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="#06101E"/>
  <rect width="1200" height="360" fill="url(#g)"/>

  <!-- Left fade glow -->
  <rect width="300" height="360" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="360" fill="url(#bar)" rx="2"/>

  <!-- ── LEFT: Identity ── -->

  <!-- Tag pill -->
  <rect x="48" y="80" width="76" height="22" rx="3" fill="#0078D41A" stroke="#00C8E833" stroke-width="1"/>
  <text x="86" y="95.5" text-anchor="middle" fill="#00C8E8" font-size="10" font-weight="700"
        font-family="'Courier New', monospace" letter-spacing="2">LAB 4.5</text>

  <!-- Title lines -->
  <text x="48" y="146" fill="#EEF5FF" font-size="30" font-weight="800"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="-0.5">Contract App</text>
  <text x="48" y="183" fill="#0078D4" font-size="30" font-weight="800"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="-0.5">Foundry</text>
  <text x="48" y="220" fill="#EEF5FF" font-size="30" font-weight="800"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" letter-spacing="-0.5">Upgrade</text>

  <!-- Subtitle -->
  <text x="48" y="256" fill="#7A9CBF" font-size="12.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Migrate from n8n to the Azure AI</text>
  <text x="48" y="273" fill="#7A9CBF" font-size="12.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Foundry Responses API in 4 steps.</text>

  <!-- Vertical separator -->
  <line x1="282" y1="60" x2="282" y2="300" stroke="#1A3A5C" stroke-width="1"/>

  <!-- ── STEPS ── -->
  <!-- Connector line between circles (434→1014) -->
  <line x1="434" y1="148" x2="1014" y2="148" stroke="#1A3A5C" stroke-width="1"/>

  <!-- ─ STEP 1 ─ x=398 -->
  <circle cx="398" cy="148" r="36" fill="#0D1F35" stroke="#0078D4" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- key icon -->
  <g transform="translate(386,136)" fill="none" stroke="#60AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="4" width="10" height="12" rx="3"/>
    <line x1="6" y1="4" x2="6" y2="1"/>
    <line x1="3" y1="10" x2="9" y2="10"/>
    <rect x="13" y="6" width="9" height="9" rx="1"/>
    <line x1="17.5" y1="6" x2="17.5" y2="3"/>
  </g>
  <text x="398" y="205" text-anchor="middle" fill="#0078D4" font-size="9" font-weight="700"
        font-family="'Courier New',monospace" letter-spacing="1.8">STEP 01</text>
  <text x="398" y="225" text-anchor="middle" fill="#EEF5FF" font-size="13.5" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Gather Foundry</text>
  <text x="398" y="242" text-anchor="middle" fill="#EEF5FF" font-size="13.5" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Credentials</text>
  <text x="398" y="264" text-anchor="middle" fill="#7A9CBF" font-size="11.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Agent name, endpoint</text>
  <text x="398" y="279" text-anchor="middle" fill="#7A9CBF" font-size="11.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">&amp; API key from Foundry</text>

  <!-- Arrow 1→2 -->
  <text x="508" y="155" text-anchor="middle" fill="#2A4A6C" font-size="22" font-weight="700"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">›</text>

  <!-- ─ STEP 2 ─ x=615 -->
  <circle cx="615" cy="148" r="36" fill="#0D1F35" stroke="#1A3A5C" stroke-width="1.5"/>
  <!-- terminal icon -->
  <g transform="translate(602,136)" fill="none" stroke="#00C8E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="3,17 9,11 3,5"/>
    <line x1="11" y1="19" x2="21" y2="19"/>
  </g>
  <text x="615" y="205" text-anchor="middle" fill="#0078D4" font-size="9" font-weight="700"
        font-family="'Courier New',monospace" letter-spacing="1.8">STEP 02</text>
  <text x="615" y="225" text-anchor="middle" fill="#EEF5FF" font-size="13.5" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Claude Code</text>
  <text x="615" y="242" text-anchor="middle" fill="#EEF5FF" font-size="13.5" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Rewrites Backend</text>
  <text x="615" y="264" text-anchor="middle" fill="#7A9CBF" font-size="11.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Removes n8n, adds PDF.js,</text>
  <text x="615" y="279" text-anchor="middle" fill="#7A9CBF" font-size="11.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">wires Foundry API</text>

  <!-- Arrow 2→3 -->
  <text x="725" y="155" text-anchor="middle" fill="#2A4A6C" font-size="22" font-weight="700"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">›</text>

  <!-- ─ STEP 3 ─ x=832 -->
  <circle cx="832" cy="148" r="36" fill="#0D1F35" stroke="#1A3A5C" stroke-width="1.5"/>
  <!-- globe/browser icon -->
  <g transform="translate(819,136)" fill="none" stroke="#00C8E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <path d="M12 3 C8 7 8 17 12 21 C16 17 16 7 12 3"/>
  </g>
  <text x="832" y="205" text-anchor="middle" fill="#0078D4" font-size="9" font-weight="700"
        font-family="'Courier New',monospace" letter-spacing="1.8">STEP 03</text>
  <text x="832" y="225" text-anchor="middle" fill="#EEF5FF" font-size="13.5" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Test It Live</text>
  <text x="832" y="264" text-anchor="middle" fill="#7A9CBF" font-size="11.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Upload NDA, ask a question,</text>
  <text x="832" y="279" text-anchor="middle" fill="#7A9CBF" font-size="11.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">confirm the agent answers</text>

  <!-- Arrow 3→4 -->
  <text x="942" y="155" text-anchor="middle" fill="#2A4A6C" font-size="22" font-weight="700"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">›</text>

  <!-- ─ STEP 4 ─ x=1049 -->
  <circle cx="1049" cy="148" r="36" fill="#0D1F35" stroke="#1A3A5C" stroke-width="1.5"/>
  <!-- activity/traces icon -->
  <g transform="translate(1037,136)" fill="none" stroke="#00C8E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="1,12 4,12 7,4 9,20 11,12 13,12 15,8 17,16 19,12 23,12"/>
  </g>
  <text x="1049" y="205" text-anchor="middle" fill="#0078D4" font-size="9" font-weight="700"
        font-family="'Courier New',monospace" letter-spacing="1.8">STEP 04</text>
  <text x="1049" y="225" text-anchor="middle" fill="#EEF5FF" font-size="13.5" font-weight="600"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Check the Traces</text>
  <text x="1049" y="264" text-anchor="middle" fill="#7A9CBF" font-size="11.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Watch the conversation in</text>
  <text x="1049" y="279" text-anchor="middle" fill="#7A9CBF" font-size="11.5"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Foundry's Traces view</text>

  <!-- Bottom label -->
  <text x="1152" y="340" text-anchor="end" fill="#1A3A5C" font-size="11"
        font-family="'Courier New',monospace" letter-spacing="1">MLAI COMMUNITY LABS · WEEK 4</text>
</svg>
